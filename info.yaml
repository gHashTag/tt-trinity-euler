# Tiny Tapeout project information
project:
  title:        "TRI-1 Euler — Trinity e-engine 4-tile NEUROMORPHIC SoC"
  author:       "Dmitrii Vasilev · Trinity Stack"
  discord:      "t27_dev"
  description:  |
    TRI-1 Euler is the e-engine SKU of the TRI NET sacred-constant triplet
    (phi-anchor / e-engine / gamma-surface) submitted to TTSKY26b (siblings:
    tt-trinity-phi 1x1, tt-trinity-gamma 8x4). Neuromorphic SKU lineage:
    tt-trinity-holo / tt-trinity-mini -> TRI-1 Euler 2x2.

    Core (2x2, 4 tiles):
      - 4-PE GF16(2^4) mesh: trinity_mesh_2x2 with trinity_router_2x2
        crossbar NoC; 4 trinity_gf16_tile PEs (gf16_dot4 compute kernel).
      - BitNet b1.58 ternary MLP encoder: on-chip 64->32->8 neuromorphic
        3-layer net with hardcoded {-1,0,+1} weights (PhD Ch. 35 silicon
        JEPA-T front-end). Neuromorphic signature module.
      - Crown47 ROM + crown47_rom_8bit: 47 Trinity constants (Crown42 +
        5 Tegmark-31 fillers) in 24-bit pseudo-float; ~120 cells.
      - Friend/foe handshake: trinity_friend_foe with EULER anchor 8'hAE;
        serial inter-chip recognition on uio[3:0] (tx/rx/friend/valid).
      - phi_anchor_post: proves phi^2+phi^-2=3 via Lucas recurrence on
        power-up (~120 cells POST guard).
      - phi_pll_div: phi-ratio fractional divider (~50 cells).
      - 0x47C0 cross-die anchor: {uio_out, uo_out}==0x47C0 on reset
        (canonical GF16 dot-product result, phi^2+phi^-2=3 marker).

    Differentiators:
      (1) native GF(16) ternary MAC silicon (0 DSP);
      (2) BitNet b1.58 ternary MLP encoder on-chip (neuromorphic SKU);
      (3) phi^2+phi^-2=3 POST self-test via Lucas chain;
      (4) 0 new * in synthesisable RTL (R-SI-1 clean);
      (5) Crown47 47-constant ROM (Tegmark-31 physics coverage);
      (6) TRI NET friend/foe inter-chip handshake (8'hAE);
      (7) 0x47C0 cross-die anchor (deterministic ledger);
      (8) Apache-2.0 + SKY130A open PDK;
      (9) DOI-anchored + Coq-verified provenance.

    Anchor: phi^2+phi^-2=3. DOI: 10.5281/zenodo.19227877.
    Defense: 2026-06-15.
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "2x2"

  top_module:  "tt_um_ghtag_trinity_gf16"

  source_files:
    - "tt_um_ghtag_trinity_gf16.v"
    - "gf16_mul.v"
    - "gf16_add.v"
    - "gf16_dot4.v"
    - "gf16_dot8.v"
    - "gf16_popcount.v"
    - "trinity_gf16_tile.v"
    - "trinity_router_2x2.v"
    - "trinity_mesh_2x2.v"
    - "trinity_master_fsm.v"
    - "trinity_friend_foe.v"
    - "trinity_packet.vh"
    - "phi_anchor_post.v"
    - "phi_pll_div.v"
    - "bitnet_encoder.v"
    - "crown47_rom.v"
    - "crown47_rom_8bit.v"

pinout:
  ui[0]: "load_mode"
  ui[1]: "data_bit_0"
  ui[2]: "data_bit_1"
  ui[3]: "data_bit_2"
  ui[4]: "data_bit_3"
  ui[5]: "data_bit_4"
  ui[6]: "crown_addr_6"
  ui[7]: "data_bit_6"

  uo[0]: "result_bit_0"
  uo[1]: "result_bit_1"
  uo[2]: "result_bit_2"
  uo[3]: "result_bit_3"
  uo[4]: "result_bit_4"
  uo[5]: "result_bit_5"
  uo[6]: "result_bit_6"
  uo[7]: "result_bit_7"

  uio[0]: "ff_tx (friend/foe TX)"
  uio[1]: "ff_rx (friend/foe RX, input)"
  uio[2]: "friend_detected"
  uio[3]: "handshake_valid"
  uio[4]: "result_high_bit_4"
  uio[5]: "result_high_bit_5"
  uio[6]: "crown_byte_sel_0"
  uio[7]: "crown_mode_en"

yaml_version: 6
