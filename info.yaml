# Tiny Tapeout project information
project:
  title:        "Trinity GF16 Dot Product Accelerator"
  author:       "Dmitrii Vasilev · Trinity Stack"
  discord:      "t27_dev"
  description:  |
    GF16 (Golden Float 16-bit, bias=31) dot product N=4. FPGA-validated at 323 MHz on XC7A100T.
    Apache 2.0. Anchor theorem: phi^2 + phi^-2 = 3 (Trinity identity, 84-theorem Coq base in t27).
    DOI: 10.5281/zenodo.19227877. Provenance: gHashTag/trinity-fpga#19, R-SI compliance map in
    gHashTag/trios assertions/igla_assertions.json. Step 1 of L-DPC3->L-DPC4->L-DPC5 silicon
    roadmap toward TRL 7 silicon-validation for PhD defense 2026-06-15.
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "8x2"  # bumped 2x2 -> 8x2 in PR #8 (Wave-26b SUPER-CROWN) to accommodate full Trinity SoC mini: 4 GF16 tiles + mesh + master FSM + 6 CROWN POST modules + 16x16 ternary matmul + BitNet encoder + BPB counter + BLAKE3 anchor + multi-tile RECEIPT + ALU-9 decoder + RING27 memory + phi-PLL + Wishbone-lite full. Target ~16000 gates @ 60% density on SKY130.

  top_module:  "tt_um_ghtag_trinity_gf16"

  source_files:
    - "tt_um_ghtag_trinity_gf16.v"
    - "gf16_mul.v"
    - "gf16_add.v"
    - "gf16_dot4.v"
    - "trinity_gf16_tile.v"
    - "trinity_router_2x2.v"
    - "trinity_mesh_2x2.v"
    - "trinity_master_fsm.v"
    - "phi_anchor_post.v"
    - "lucas_rom.v"
    - "vsa_matmul_8x8.v"
    - "crc32_receipt.v"
    - "hwrng_lfsr.v"
    - "wb_status_reg.v"
    - "vsa_matmul_16x16.v"
    - "bitnet_encoder.v"
    - "bpb_counter.v"
    - "blake3_anchor.v"
    - "multi_tile_receipt.v"
    - "alu9_decoder.v"
    - "ring27_memory.v"
    - "phi_pll_div.v"
    - "wishbone_full.v"

