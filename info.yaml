    - "phi_anchor_post.v"
    - "lucas_rom.v"
    - "gf16_popcount.v"
    - "gf16_popcount16.v"
    - "vsa_matmul_8x8.v"
    - "crc32_receipt.v"
    - "hwrng_lfsr.v"
    - "wb_status_reg.v"
    - "vsa_matmul_16x16.v"
    - "bitnet_encoder.v"
    - "bpb_counter.v"
    - "blake3_anchor.v"
    - "multi_tile_receipt.v"
    - "alu9_decoder.v"
    - "ring27_memory.v"
    - "phi_pll_div.v"
    - "wishbone_full.v"
